<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Control</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" >
</head>
<body>
    <div class="container mt-3 bg-info">
        
        <h2 align="center" class="text-danger mt-2">Formulir Pendaftaran Siswa Baru</h2>

        <div class="mb-3 form-floating">
            <input type="text" placeholder="Masukkan NIPD" class="form-control">
            <label>NIPD</label>
        </div>

        <div class="mb-3 form-floating">
            <input type="text" placeholder="Nama Lengkap" class="form-control">
            <label>Nama Lengkap</label> 
        </div>

        <div class="mb-3 form-floating">
            <input type="text" placeholder="Email" class="form-control">
            <label>Email</label>
        </div>
        <div class="mb-3 form-floating">
        <textarea class="form-control" placeholder="Alamat Lengkap"></textarea>
        <Label>Alamat Lengkap</Label>
        </div>
        <DIV class="mb-3">
            <select class="form-select" placeholder="Pilih Jurusanmu">
                <option>Rekayasa Perangkat Lunak</option>
                <Option>Teknik Komputer & Jaringan</Option>
                <option>Design Komunikasi Visual</option>
                <option>Bisnis Digital</option>
            </select>
        </DIV>

        <div class="mb-3">

            <input class="form-check-input" type="checkbox">
            <label class="form-check-label">eskul pramuka</label>

            <input class="form-check-input" type="checkbox">
            <label class="form-check-label">Eskul Voli</label>

            <input class="form-check-input" type="checkbox">
            <label class="form-check-label">Eskul paskibra</label>

        <input class="form-check-input" type="checkbox">
        <label class="form-check-label">Eskul futsal</label>

        <input class="form-check-input" type="checkbox">
            <label class="form-check-label">Eskul PMR</label>
            
            <input class="form-check-input" type="checkbox">
            <label class="form-check-label">Pencak Silat</label>

            <input class="form-check-input" type="checkbox">
            <label class="form-check-label">Natbinari</label>

            <input class="form-check-input" type="checkbox">
            <label class="form-check-label">Tari</label>

            <input class="form-check-input" type="checkbox">
            <label class="form-check-label">Rohis</label>

        </div>

        <div class="mb-3" form-check>
       <div class="row">
        <div class="col-6">
            <input class="form-check-input" type="radio" name="jk">
            <label class="form-check-label">Laki-laki</label>
        </div>
        <div class="col-6">
            <input class="form-check-input" type="radio" name="jk">
            <label class="form-check-label">perempuan</label>
        </div>
       </div>

        </div>
        <div class="mb-3">
            <div class="btn button btn-primary" data-bs-toggle="tooltip" data-bs-placement="top" data-bs-title="Untuk Simpan Data">Simpan Data</div>
            <button class="btn button btn-danger">Hapus Data</button>
        </div>
    </div>
</body>
</html>
